<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#174c3f">
<title>RESERVE Scanner</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#173f34;background:#f6f3ea}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f6f3ea}.wrap{min-height:100vh;display:flex;flex-direction:column}.top{padding:18px 18px 12px;background:#174c3f;color:#fff}.top h1{margin:0;font-size:24px}.top p{margin:6px 0 0;opacity:.9}.camera{position:relative;flex:1;min-height:56vh;background:#000;overflow:hidden}.camera video{width:100%;height:100%;min-height:56vh;object-fit:cover;display:block}.guide{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}.guide::before{content:"";width:min(78vw,520px);height:170px;border:3px solid rgba(255,255,255,.92);border-radius:18px;box-shadow:0 0 0 9999px rgba(0,0,0,.18)}.status{padding:14px 18px;background:#fff;font-size:17px;min-height:54px}.actions{padding:12px 18px 22px;display:grid;grid-template-columns:1fr 1fr;gap:10px;background:#fff}.actions button,.actions a{appearance:none;border:0;border-radius:14px;padding:15px 14px;font:inherit;font-weight:700;text-align:center;text-decoration:none}.primary{background:#287a49;color:#fff}.secondary{background:#ebe8de;color:#174c3f}.manual{grid-column:1/-1;display:flex;gap:8px}.manual input{flex:1;min-width:0;border:1px solid #cfcbbf;border-radius:12px;padding:13px;font:inherit}.manual button{padding-inline:18px}.small{font-size:13px;color:#6b7280;padding:0 18px 12px;background:#fff}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><h1>RESERVE Scanner</h1><p>Nur Kamera + Barcode-Erkennung. Keine schweren RESERVE-Module.</p></header>
  <main class="camera"><video id="video" playsinline muted></video><div class="guide"></div></main>
  <div id="status" class="status">Kamera wird gestartet…</div>
  <div class="actions">
    <button id="again" class="primary" type="button">Kamera neu starten</button>
    <a id="cancel" class="secondary" href="/?scannerReturn=1#stock">Zurück</a>
    <div class="manual"><input id="manual" inputmode="numeric" placeholder="Barcode manuell eingeben"><button id="manualGo" class="primary" type="button">OK</button></div>
  </div>
  <div class="small">Nach erfolgreicher Erkennung kehrst du automatisch zu RESERVE zurück.</div>
</div>
<script>
(()=>{
  'use strict';
  const video=document.getElementById('video'),status=document.getElementById('status'),again=document.getElementById('again'),manual=document.getElementById('manual'),manualGo=document.getElementById('manualGo'),cancel=document.getElementById('cancel');
  const params=new URLSearchParams(location.search),diag=params.get('diag')==='1';
  cancel.href='/?scannerReturn=1'+(diag?'&reserveDiag=1':'')+'#stock';
  let stream=null,timer=null,running=false,detector=null;
  const setStatus=t=>status.textContent=t;
  function stop(){running=false;if(timer)clearTimeout(timer);timer=null;if(stream){try{stream.getTracks().forEach(t=>t.stop())}catch(_){ }stream=null}try{video.pause()}catch(_){ }try{video.srcObject=null}catch(_){ }}
  function go(code){code=String(code||'').replace(/\D/g,'');if(!code)return;stop();setStatus('Barcode erkannt: '+code);const q=new URLSearchParams();q.set('reserveScanned',code);if(diag)q.set('reserveDiag','1');location.replace('/?'+q.toString()+'#stock')}
  async function start(){
    stop();setStatus('Kamera wird gestartet…');
    if(!navigator.mediaDevices?.getUserMedia){setStatus('Kamera wird von diesem Browser nicht unterstützt.');return}
    try{
      if(!('BarcodeDetector' in window)){setStatus('BarcodeDetector nicht verfügbar. Bitte Barcode unten manuell eingeben.');return}
      const formats=await BarcodeDetector.getSupportedFormats();const wanted=['ean_13','ean_8','upc_a','upc_e'].filter(f=>formats.includes(f));detector=new BarcodeDetector({formats:wanted.length?wanted:formats});
      stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:640,max:960},height:{ideal:480,max:720},frameRate:{ideal:12,max:15}}});
      video.srcObject=stream;await video.play();running=true;setStatus('Kamera aktiv – Barcode in den Rahmen halten.');
      const scan=async()=>{if(!running||!stream)return;try{const found=await detector.detect(video);if(found?.length){go(found[0].rawValue);return}}catch(_){ }if(running)timer=setTimeout(scan,650)};timer=setTimeout(scan,350);
    }catch(e){setStatus('Kamera konnte nicht gestartet werden. Bitte Berechtigung prüfen oder Barcode manuell eingeben.')}
  }
  again.addEventListener('click',start);manualGo.addEventListener('click',()=>go(manual.value));manual.addEventListener('keydown',e=>{if(e.key==='Enter')go(manual.value)});window.addEventListener('pagehide',stop,{once:true});start();
})();
</script>
</body>
</html>
