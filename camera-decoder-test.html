<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RESERVE Kamera + Decoder Test</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f5f1e8;color:#1d2925}.wrap{max-width:720px;margin:auto;padding:18px}h1{margin:0 0 6px;color:#173f35}.muted{color:#6c746f}.card{background:#fffdf8;border:1px solid #ded8ca;border-radius:16px;padding:16px;margin:14px 0}button{border:0;background:#173f35;color:#fff;padding:13px 16px;border-radius:10px;font-weight:800;font-size:16px;margin:4px 6px 4px 0}button.secondary{background:#e9e3d6;color:#173f35}video{width:100%;min-height:260px;max-height:58vh;background:#000;border-radius:14px;object-fit:cover;display:block}.status{padding:10px 12px;border-radius:10px;background:#edf4ef;margin-top:10px}.bad{background:#f7dfdc;color:#8b2d27}.good{background:#dfeee5;color:#246448}pre{white-space:pre-wrap;word-break:break-word;background:#0f172a;color:#fff;border-radius:12px;padding:12px;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;max-height:44vh;overflow:auto}
</style>
</head>
<body><div class="wrap">
<h1>RESERVE Kamera + Decoder</h1>
<p class="muted">Nur Kamera, Barcode-Decoder und Messung. Keine Rezepte, kein Vorrat, kein RESERVE-Rendering.</p>
<div class="card"><button id="start">Kamera + Decoder starten</button><button id="stop" class="secondary" disabled>Stoppen</button><div id="status" class="status">Bereit.</div></div>
<div class="card"><video id="video" autoplay muted playsinline></video></div>
<div class="card"><pre id="report"></pre><button id="reset" class="secondary">Messung zurücksetzen</button></div>
</div>
<script>
(()=>{'use strict';
let stream=null,controls=null,scanTimer=null,running=false,backend='none',started=performance.now(),longCount=0,longTotal=0,longMax=0,loopCount=0,loopMax=0,frames=0,lastFrameAt=0,frameGapMax=0,frameWatch=null,attempts=0,attemptTotal=0,attemptMax=0,lastAttempt=0,detected='';
const ZXING_URL='https://unpkg.com/@zxing/browser@0.2.1/umd/zxing-browser.min.js';
const $=id=>document.getElementById(id),status=$('status'),video=$('video'),report=$('report');
function setStatus(t,type=''){status.textContent=t;status.className='status'+(type==='bad'?' bad':type==='good'?' good':'')}
function round(n){return Math.round((Number(n)||0)*10)/10}
function trackSettings(){return stream?.getVideoTracks?.()[0]?.getSettings?.()||{}}
function text(){const s=trackSettings();return [
'RESERVE Kamera+Decoder-Isolation v1',
`Laufzeit: ${Math.round((performance.now()-started)/1000)} s`,
`Backend: ${backend}`,
`Stream: ${stream||controls?'aktiv':'aus'}`,
`Video readyState: ${video.readyState} | ${video.videoWidth||0}×${video.videoHeight||0}`,
`Track: ${s.width||'?'}×${s.height||'?'} @ ${s.frameRate||'?'} fps`,
`Video-Frames beobachtet: ${frames} | größter Frame-Abstand ${round(frameGapMax)} ms`,
`Decode-Versuche: ${attempts} | letzter ${round(lastAttempt)} ms | avg ${attempts?round(attemptTotal/attempts):0} ms | max ${round(attemptMax)} ms`,
`Erkannt: ${detected||'–'}`,
`Long Tasks ≥50ms: ${longCount} | gesamt ${round(longTotal)} ms | max ${round(longMax)} ms`,
`Event-Loop-Stau >50ms: ${loopCount} | max ${round(loopMax)} ms`,
`BarcodeDetector verfügbar: ${'BarcodeDetector'in window?'ja':'nein'}`,
`Browser: ${navigator.userAgent}`
].join('\n')}
function paint(){report.textContent=text()}
try{const po=new PerformanceObserver(list=>{for(const e of list.getEntries()){longCount++;longTotal+=e.duration;longMax=Math.max(longMax,e.duration)}});po.observe({type:'longtask',buffered:true})}catch(_){ }
let expected=performance.now()+250;setInterval(()=>{const now=performance.now(),lag=Math.max(0,now-expected);expected=now+250;if(lag>50){loopCount++;loopMax=Math.max(loopMax,lag)}paint()},250);
function watchFrames(){if(!running)return;const now=performance.now();if(lastFrameAt)frameGapMax=Math.max(frameGapMax,now-lastFrameAt);lastFrameAt=now;frames++;if('requestVideoFrameCallback'in HTMLVideoElement.prototype)video.requestVideoFrameCallback(watchFrames);else frameWatch=requestAnimationFrame(watchFrames)}
function noteAttempt(ms){attempts++;lastAttempt=ms;attemptTotal+=ms;attemptMax=Math.max(attemptMax,ms)}
function loadZXing(){if(window.ZXingBrowser)return Promise.resolve(window.ZXingBrowser);return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=ZXING_URL;s.async=true;s.onload=()=>window.ZXingBrowser?resolve(window.ZXingBrowser):reject(new Error('ZXing unavailable'));s.onerror=reject;document.head.appendChild(s)})}
async function startNative(){backend='native BarcodeDetector';const formats=await BarcodeDetector.getSupportedFormats();const wanted=['ean_13','ean_8','upc_a','upc_e'].filter(x=>formats.includes(x));const detector=new BarcodeDetector({formats:wanted.length?wanted:formats});stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:640,max:960},height:{ideal:480,max:720},frameRate:{ideal:12,max:15}}});video.srcObject=stream;await video.play();const scan=async()=>{if(!running||!stream)return;const t=performance.now();try{const codes=await detector.detect(video);noteAttempt(performance.now()-t);if(codes?.length){detected=String(codes[0].rawValue||'');setStatus('Barcode erkannt: '+detected,'good')}}catch(e){noteAttempt(performance.now()-t)}if(running)scanTimer=setTimeout(scan,700)};scanTimer=setTimeout(scan,300)}
async function startZXing(){backend='ZXing fallback';const ZX=await loadZXing();let reader;try{reader=new ZX.BrowserMultiFormatOneDReader(undefined,{delayBetweenScanAttempts:900,delayBetweenScanSuccess:1200})}catch(_){reader=new ZX.BrowserMultiFormatOneDReader()}try{if('timeBetweenDecodingAttempts'in reader)reader.timeBetweenDecodingAttempts=900}catch(_){ }let lastCb=performance.now();controls=await reader.decodeFromConstraints({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:640,max:960},height:{ideal:480,max:720},frameRate:{ideal:12,max:15}}},video,(result,error)=>{const now=performance.now();noteAttempt(now-lastCb);lastCb=now;if(result){detected=String(result.getText?.()||result.text||'');setStatus('Barcode erkannt: '+detected,'good')}})}
async function start(){stop(false);running=true;started=performance.now();frames=lastFrameAt=frameGapMax=0;attempts=attemptTotal=attemptMax=lastAttempt=0;detected='';$('start').disabled=true;$('stop').disabled=false;setStatus('Kamera + Decoder werden gestartet …');try{if('BarcodeDetector'in window)await startNative();else await startZXing();setStatus('Kamera + Decoder laufen. 20–30 Sekunden bewegen.');if('requestVideoFrameCallback'in HTMLVideoElement.prototype)video.requestVideoFrameCallback(watchFrames);else frameWatch=requestAnimationFrame(watchFrames)}catch(e){running=false;setStatus('Start fehlgeschlagen: '+(e?.name||'Fehler')+' '+(e?.message||''),'bad');$('start').disabled=false;$('stop').disabled=true}paint()}
function stop(update=true){running=false;if(scanTimer)clearTimeout(scanTimer);scanTimer=null;if(frameWatch)cancelAnimationFrame(frameWatch);frameWatch=null;if(controls){try{controls.stop()}catch(_){}controls=null}if(stream){for(const t of stream.getTracks())t.stop();stream=null}try{video.pause()}catch(_){}video.srcObject=null;$('start').disabled=false;$('stop').disabled=true;if(update)setStatus('Gestoppt.');paint()}
function reset(){started=performance.now();longCount=longTotal=longMax=loopCount=loopMax=frames=lastFrameAt=frameGapMax=attempts=attemptTotal=attemptMax=lastAttempt=0;detected='';paint()}
$('start').addEventListener('click',start);$('stop').addEventListener('click',()=>stop(true));$('reset').addEventListener('click',reset);window.addEventListener('pagehide',()=>stop(false),{once:true});paint();
})();
</script></body></html>
