name: Deploy RESERVE to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build validated live recipe library
        run: |
          node tools/validate-recipes.mjs data/recipes.json
          for f in data/quality-batch-*.json; do node tools/validate-recipes.mjs "$f"; done
          node tools/merge-quality-batches.mjs data/recipes.json data/quality-batch-*.json build/recipes-live.json
          node tools/validate-recipes.mjs build/recipes-live.json
          cp build/recipes-live.json data/recipes.json
      - name: Enable RESERVE feature modules
        run: sed -i 's#</body>#<script src="shopping-v2.js"></script><script src="reserve-core-v3.js"></script><script src="cloud-sync-v1.js"></script><script src="barcode-v1.js"></script><script src="autopilot-v1.js"></script><script src="emergency-v1.js"></script></body>#' index.html
      - name: Smoke test production build
        run: node tools/smoke-test.mjs
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser end-to-end test
        run: node tools/e2e-reserve.mjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
