name: Deploy RESERVE to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build validated live recipe library
        run: |
          node tools/enrich-recipes-v1.mjs data/recipes.json
          for f in data/quality-batch-*.json; do node tools/enrich-recipes-v1.mjs "$f"; done
          node tools/validate-recipes.mjs data/recipes.json
          for f in data/quality-batch-*.json; do node tools/validate-recipes.mjs "$f"; done
          node tools/merge-quality-batches.mjs data/recipes.json data/quality-batch-*.json build/recipes-live.json
          cp build/recipes-live.json data/recipes.json
          node tools/build-recipe-index.mjs data/recipes.json data/recipe-index.json
          node tools/build-recipe-delivery.mjs data/recipes.json data/recipe-details data/recipe-catalog.json data/recipe-details-manifest.json
      - name: Check JavaScript syntax
        run: |
          for f in shopping-v2.js shopping-scan-v1.js reserve-core-v3.js cloud-sync-v1.js multipack-v1.js barcode-v1.js barcode-learning-v1.js purchase-history-v1.js receipt-capture-v1.js price-learning-v1.js price-trends-v1.js weekly-price-bridge-v1.js autopilot-v1.js autopilot-v2.js emergency-food-classifier-v1.js emergency-v1.js consumption-learning-v1.js expiry-consumption-v1.js expiry-ui-v1.js smart-priorities-v1.js today-dashboard-v1.js weekly-plan-v2.js reserve-stock-protection-v1.js pantry-intelligence-v1.js predictive-replenishment-v1.js recipe-index-runtime-v1.js recipe-detail-runtime-v1.js allergy-safety-v1.js feedback-v1.js usage-measurement-v1.js cabinet-inventory-v1.js product-icons-v1.js mobile-ux-v1.js performance-v1.js; do node --check "$f"; done
          for f in tools/*.mjs; do node --check "$f"; done
      - name: Enable fast startup and compact recipe delivery
        run: |
          sed -i "s#fetch('data/recipes.json',{cache:'no-store'})#fetch('data/recipe-catalog.json',{cache:'default'})#" index.html
          sed -i "s#loadProfile();loadRecipes();#loadProfile();refresh();const loadRecipesLater=()=>loadRecipes();if('requestIdleCallback'in window)requestIdleCallback(loadRecipesLater,{timeout:1200});else setTimeout(loadRecipesLater,0);#" index.html
      - name: Enable RESERVE feature modules
        run: sed -i 's#</body>#<script src="shopping-v2.js"></script><script src="shopping-scan-v1.js"></script><script src="reserve-core-v3.js"></script><script src="cloud-sync-v1.js"></script><script src="multipack-v1.js"></script><script src="barcode-v1.js"></script><script src="purchase-history-v1.js"></script><script src="receipt-capture-v1.js"></script><script src="price-learning-v1.js"></script><script src="price-trends-v1.js"></script><script src="autopilot-v1.js"></script><script src="autopilot-v2.js"></script><script src="emergency-food-classifier-v1.js"></script><script src="emergency-v1.js"></script><script src="recipe-index-runtime-v1.js"></script><script src="recipe-detail-runtime-v1.js"></script><script src="consumption-learning-v1.js"></script><script src="expiry-consumption-v1.js"></script><script src="expiry-ui-v1.js"></script><script src="reserve-stock-protection-v1.js"></script><script src="pantry-intelligence-v1.js"></script><script src="predictive-replenishment-v1.js"></script><script src="smart-priorities-v1.js"></script><script src="today-dashboard-v1.js"></script><script src="weekly-plan-v2.js"></script><script src="weekly-price-bridge-v1.js"></script><script src="allergy-safety-v1.js"></script><script src="feedback-v1.js"></script><script src="usage-measurement-v1.js"></script><script src="cabinet-inventory-v1.js"></script><script src="product-icons-v1.js"></script><script src="barcode-learning-v1.js"></script><script src="mobile-ux-v1.js"></script><script src="performance-v1.js"></script></body>#' index.html
      - name: Smoke test production build
        run: node tools/smoke-test.mjs
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser end-to-end test
        run: |
          node tools/e2e-reserve.mjs
          node tools/e2e-mobile-resilience.mjs
          node tools/e2e-consumption.mjs
          node tools/e2e-expiry-ui.mjs
          node tools/e2e-autopilot-v2.mjs
          node tools/e2e-weekly-plan-v2.mjs
          node tools/e2e-receipt-capture.mjs
          node tools/e2e-price-learning.mjs
          node tools/e2e-price-trends.mjs
          node tools/e2e-feedback.mjs
          node tools/e2e-usage-measurement.mjs
          node tools/e2e-shopping-scan.mjs
          node tools/e2e-cabinet-inventory.mjs
          node tools/e2e-product-icons.mjs
          node tools/e2e-full-pantry-cycle.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          name: github-pages-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
