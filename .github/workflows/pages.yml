name: Deploy RESERVE to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build validated live recipe library
        run: |
          node tools/enrich-recipes-v1.mjs data/recipes.json
          for f in data/quality-batch-*.json; do node tools/enrich-recipes-v1.mjs "$f"; done
          node tools/validate-recipes.mjs data/recipes.json
          for f in data/quality-batch-*.json; do node tools/validate-recipes.mjs "$f"; done
          node tools/merge-quality-batches.mjs data/recipes.json data/quality-batch-*.json build/recipes-live.json
          cp build/recipes-live.json data/recipes.json
          node tools/apply-recipe-photos.mjs data/recipes.json
          node tools/build-recipe-index.mjs data/recipes.json data/recipe-index.json
          node tools/build-recipe-delivery.mjs data/recipes.json data/recipe-details data/recipe-catalog.json data/recipe-details-manifest.json
      - name: Check JavaScript syntax
        run: |
          for f in personal-recipe-pdf-v1.js date-image-recovery-v1.js date-format-v1.js date-format-ui-v1.js date-token-guard-v1.js date-policy-v1.js rekek-digit-core-v1.js rekek-digit-worker-v1.js rekek-digit-assist-v1.js product-identity-v1.js scan-product-identity-v1.js cabinet-grid-density-v1.js personal-recipe-parser-v1.js personal-recipes-v1.js retailer-catalog-v1.js product-knowledge-v1.js ingredient-identity-v1.js visual-flow-v1.js shopping-v2.js shopping-scan-v1.js reserve-core-v3.js cloud-sync-v1.js multipack-v1.js barcode-v1.js product-capture-assist-v1.js scan-confidence-v1.js product-community-v1.js packaging-vision-v2.js catalog-review-v1.js barcode-fast-feedback-v1.js barcode-search-v2.js barcode-mobile-focus-fix-v1.js barcode-camera-safe-v1.js expiry-camera-v1.js expiry-vision-v1.js expiry-learning-v1.js mhd-review-v1.js scanner-priority-v1.js scanner-launcher-v1.js postscan-trace-v1.js runtime-profiler-v1.js barcode-lookup-resilience-v1.js barcode-learning-v1.js purchase-history-v1.js receipt-capture-v1.js price-learning-v1.js price-trends-v1.js weekly-price-bridge-v1.js autopilot-v1.js autopilot-v2.js emergency-food-classifier-v1.js emergency-v1.js consumption-learning-v1.js expiry-consumption-v1.js expiry-ui-v1.js smart-priorities-v1.js today-dashboard-v1.js weekly-plan-v2.js reserve-stock-protection-v1.js pantry-intelligence-v1.js predictive-replenishment-v1.js recipe-index-runtime-v1.js recipe-detail-runtime-v1.js allergy-safety-v1.js feedback-v1.js usage-measurement-v1.js cabinet-inventory-v1.js product-icons-v1.js product-images-v1.js container-units-v1.js mobile-ux-v1.js performance-v1.js input-guard-v1.js; do node --check "$f"; done
          for f in tools/*.mjs; do node --check "$f"; done
          python3 -m py_compile tools/benchmark-synthetic-expiry-ocr.py
          bash -n tools/train-expiry-tesseract-v0.sh
      - name: Test expiry AI data pipelines
        run: |
          node tools/test-expiry-date-inputs.mjs
          node tools/test-expiry-training-pipeline.mjs
          node tools/test-synthetic-expiry-dataset.mjs
          node tools/test-product-capture-assist.mjs
          node tools/test-scan-confidence.mjs
          node tools/test-product-community.mjs
          node tools/test-packaging-vision-v2.mjs
          node tools/test-catalog-review.mjs
          node tools/test-expiry-overload-protection.mjs
          node tools/test-expiry-recognition-timeout.mjs
          node tools/test-container-type-migration.mjs
          node tools/test-product-knowledge.mjs
          node tools/test-product-identity.mjs
          node tools/test-retailer-catalog.mjs
          node tools/test-navigation-work.mjs
          node tools/test-personal-recipe-parser.mjs
          node tools/test-rekek-sections.mjs
          node tools/test-rekek.mjs
          node tools/test-rekek-digits.mjs
          node tools/test-recipe-training.mjs
          node tools/import-retailer-catalog.mjs
      - name: Enable fast startup and compact recipe delivery
        run: |
          node tools/build-personal-recipe-pdf.mjs
          sed -i "s#fetch('data/recipes.json',{cache:'no-store'})#fetch('data/recipe-catalog.json',{cache:'default'})#" index.html
          sed -i "s#loadProfile();loadRecipes();#loadProfile();refresh();const loadRecipesLater=()=>loadRecipes();if('requestIdleCallback'in window)requestIdleCallback(loadRecipesLater,{timeout:1200});else setTimeout(loadRecipesLater,0);#" index.html
      - name: Enable RESERVE feature modules
        run: sed -i 's#</body>#<script>window.RESERVE_BUILD="20260920-expiry-lowcost-1";if("serviceWorker" in navigator){navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))).catch(()=>{});}if("caches" in window){caches.keys().then(ks=>Promise.all(ks.filter(k=>k.startsWith("tenderhawk-")).map(k=>caches.delete(k)))).catch(()=>{});}</script><script src="performance-v1.js?v=20261008-navigation-2"></script><script src="input-guard-v1.js?v=20260914-input-guard-2"></script><script src="shopping-v2.js"></script><script src="shopping-scan-v1.js"></script><script src="product-identity-v1.js?v=20261010-rice-source-1"></script><script src="ingredient-identity-v1.js?v=20261010-rice-source-1"></script><script src="date-token-guard-v1.js?v=20261020-global-dates-1"></script><script src="date-format-v1.js?v=20261020-compact-tail-1"></script><script src="date-format-ui-v1.js?v=20261020-global-dates-1"></script><script src="date-policy-v1.js?v=20261020-open-cases-1"></script><script src="reserve-core-v3.js?v=20261019-neutral-date-1"></script><script src="cloud-sync-v1.js?v=20261009-personal-1"></script><script src="multipack-v1.js"></script><script src="product-knowledge-v1.js?v=20261010-rice-source-1"></script><script src="barcode-v1.js?v=20261019-neutral-date-1"></script><script src="barcode-fast-feedback-v1.js?v=20260914-fast-feedback-1"></script><script src="barcode-mobile-focus-fix-v1.js?v=20260914-focus-1"></script><script src="barcode-camera-safe-v1.js?v=20260915-shared-camera-1"></script><script src="expiry-learning-v1.js?v=20261019-neutral-date-1"></script><script>window.RESERVE_EXPIRY_VISION_CONFIG={endpoint:"https://reserve-expiry-vision.jaronhofstetter.workers.dev"};</script><script src="expiry-vision-v1.js?v=20261010-mhd-spinner-1"></script><script src="date-image-recovery-v1.js?v=20261020-image-recovery-1"></script><script src="expiry-camera-v1.js?v=20261020-compact-tail-1"></script><script src="scanner-priority-v1.js?v=20260914-scan-priority-3"></script><script src="purchase-history-v1.js"></script><script src="receipt-capture-v1.js"></script><script src="price-learning-v1.js"></script><script src="price-trends-v1.js"></script><script src="autopilot-v1.js?v=20261010-plan-cache-1"></script><script src="emergency-food-classifier-v1.js"></script><script src="emergency-v1.js"></script><script src="recipe-index-runtime-v1.js"></script><script src="recipe-detail-runtime-v1.js"></script><script src="consumption-learning-v1.js"></script><script src="expiry-consumption-v1.js?v=20261019-neutral-date-1"></script><script src="expiry-ui-v1.js?v=20261019-neutral-date-1"></script><script src="reserve-stock-protection-v1.js?v=20261015-portions-1"></script><script src="pantry-intelligence-v1.js?v=20261019-neutral-date-1"></script><script src="predictive-replenishment-v1.js?v=20261007-visual-flow-1"></script><script src="smart-priorities-v1.js?v=20261019-neutral-date-1"></script><script src="today-dashboard-v1.js?v=20261007-visual-flow-1"></script><script src="weekly-plan-v2.js?v=20261010-plan-cache-1"></script><script src="weekly-price-bridge-v1.js?v=20261010-plan-cache-1"></script><script src="autopilot-v2.js?v=20261018-startup-1"></script><script src="allergy-safety-v1.js?v=20261007-visual-flow-1"></script><script src="feedback-v1.js"></script><script src="usage-measurement-v1.js?v=20260914-idle-1"></script><script src="cabinet-inventory-v1.js?v=20261020-global-dates-1"></script><script src="product-icons-v1.js?v=20260916-authoritative-icons-1"></script><script src="product-images-v1.js?v=20261010-ingredient-product-link-1"></script><script src="container-units-v1.js?v=20261010-purchase-count-1"></script><script src="barcode-learning-v1.js?v=20261008-knowledge-1"></script><script src="barcode-search-v2.js?v=20261019-neutral-date-1"></script><script src="mobile-ux-v1.js?v=20261019-neutral-date-1"></script><script src="visual-flow-v1.js?v=20261010-recipe-photo-layout-1"></script><script src="cabinet-grid-density-v1.js?v=20261009-clean-header-2"></script><script src="sidebar-navigation-v1.js?v=20261009-contrast-4"></script><script src="navigation-back-v1.js?v=20261010-ingredient-product-link-1"></script><script src="personal-recipe-parser-v1.js?v=20261016-structure-review-2"></script><script src="rekek-digit-assist-v1.js?v=20261013-digit-v4-1"></script><script src="personal-recipe-pdf-v1.js?v=20261020-personal-flow-1"></script><script src="personal-recipes-v1.js?v=20261020-personal-flow-1"></script><script src="rekek-quantity-core-v1.js?v=20261017-crops-3"></script><script src="rekek-quantity-test-v1.js?v=20261017-crops-3"></script><script>(function(){var on=false;try{var q=new URLSearchParams(location.search).get("reserveDiag");on=q==="1"||localStorage.getItem("reserveDiagV1")==="1"}catch(e){}if(on){var s=document.createElement("script");s.src="postscan-trace-v1.js?v=20260914-trace-1";document.body.appendChild(s)}})();</script></body>#' index.html
      - name: Activate product-linked partial expiry training build
        run: |
          sed -i 's/20260920-expiry-lowcost-1/20261002-mhd-safety-1/g' index.html
          sed -i 's/20260920-expiry-camera-13/20261006-local-first-overload-1/g' index.html
          sed -i 's/20261006-local-first-overload-1/20261006-partial-date-ui-1/g' index.html
          sed -i 's/20260920-expiry-vision-17/20261006-overload-circuit-1/g' index.html
          sed -i 's/20260920-expiry-learning-1/20261002-mhd-safety-1/g' index.html
          sed -i 's/20261002-mhd-safety-1/20261006-partial-date-ui-1/g' index.html
          sed -i 's#<script src="expiry-learning-v1.js?v=20261019-neutral-date-1"></script>#<script src="expiry-learning-v1.js?v=20261019-neutral-date-1"></script><script src="product-capture-assist-v1.js?v=20261019-neutral-date-1"></script><script src="scan-product-identity-v1.js?v=20261010-rice-source-1"></script><script src="scan-confidence-v1.js?v=20261019-neutral-date-1"></script>#' index.html
          sed -i 's/20260917-package-rows-1/20260922-snacks-category-1/g' index.html
          sed -i 's/20260922-snacks-category-1/20260928-product-capture-1/g' index.html
          sed -i 's/20260928-product-capture-1/20260929-expanded-categories-1/g' index.html
          sed -i 's/20260929-expanded-categories-1/20261001-product-images-1/g' index.html
          sed -i 's/20260917-broad-image-search-2/20261001-single-product-image-1/g' index.html
          sed -i 's#<script src="barcode-search-v2.js?v=20261019-neutral-date-1"></script>#<script src="barcode-search-v2.js?v=20261019-neutral-date-1"></script><script src="product-community-v1.js?v=20261010-clean-next-scan-1"></script><script src="packaging-vision-v2.js?v=20261004-packaging-vision-1"></script>#' index.html
          sed -i 's/20260929-compact-editor-1/20260929-expanded-categories-1/g' index.html
          sed -i 's#receipt-capture-v1.js"></script>#receipt-capture-v1.js?v=20260929-expanded-categories-1"></script>#g' index.html
          sed -i 's/20260918-container-units-11/20260928-container-units-13/g' index.html
          sed -i 's/20260928-container-units-13/20261006-honey-glass-fix-1/g' index.html
          sed -i 's/20261006-honey-glass-fix-1/20261006-ambiguous-packaging-1/g' index.html
          sed -i 's/20261006-ambiguous-packaging-1/20261006-scan-confidence-1/g' index.html
          sed -i 's/20260917-image-hydrate-1/20261006-confirmed-packaging-1/g' index.html
          sed -i 's/20261006-scan-confidence-1/20261007-visual-flow-1/g' index.html
      - name: Enable approved retailer data when available
        run: node tools/enable-retailer-catalog.mjs
      - name: Smoke test production build
        run: |
          node tools/smoke-test.mjs
          node tools/test-recipe-photos.mjs
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Build isolated MHD phone test
        run: |
          npm ci --prefix experiments/date-mobile-build --ignore-scripts --no-audit --no-fund
          python3 experiments/date-mobile-build/fetch-models.py
          node experiments/date-mobile-build/test.cjs
          node tools/test-date-mobile-diagnostics.mjs
          node tools/test-date-regions.mjs
          node tools/test-date-order.mjs
          node tools/test-date-tokens.mjs
          node tools/test-date-open-cases.mjs
          node tools/test-global-dates.mjs
          node tools/test-date-image-recovery.mjs
          node experiments/date-mobile-build/build.cjs
      - name: Verify isolated MHD phone test
        run: |
          node tools/e2e-date-mobile.mjs
          node tools/e2e-global-dates.mjs
      - name: Browser end-to-end test
        run: |
          node tools/e2e-startup-shell.mjs
          node tools/e2e-reserve.mjs
          node tools/e2e-mobile-resilience.mjs
          node tools/e2e-input-responsiveness.mjs
          node tools/e2e-navigation-latency.mjs
          node tools/e2e-navigation-back.mjs
          node tools/e2e-grid-density.mjs
          node tools/e2e-personal-recipes.mjs
          node tools/e2e-personal-recipe-flow.mjs
          node tools/e2e-rekek-import.mjs
          node tools/e2e-personal-recipe-ocr.mjs
          node tools/e2e-rekek-columns.mjs
          node tools/e2e-rekek-digits.mjs
          node tools/e2e-recipe-portions.mjs
          node tools/e2e-consumption.mjs
          node tools/e2e-expiry-ui.mjs
          node tools/test-date-policy.mjs
          node tools/test-expiry-real-formats.mjs
          node tools/test-ingredient-identity.mjs
          node tools/e2e-product-knowledge.mjs
          node tools/e2e-scan-product-identity.mjs
          node tools/e2e-autopilot-v2.mjs
          node tools/e2e-weekly-plan-v2.mjs
          node tools/e2e-receipt-capture.mjs
          node tools/e2e-price-learning.mjs
          node tools/e2e-price-trends.mjs
          node tools/e2e-feedback.mjs
          node tools/e2e-usage-measurement.mjs
          node tools/e2e-shopping-scan.mjs
          node tools/e2e-cabinet-inventory.mjs
          node tools/e2e-inventory-photos.mjs
          node tools/e2e-ingredient-photos.mjs
          node tools/e2e-product-page.mjs
          node tools/e2e-visual-flow.mjs
          node tools/e2e-chuchitisch-recipes.mjs
          node tools/e2e-mhd-review.mjs
          node tools/e2e-catalog-review.mjs
          node tools/e2e-product-icons.mjs
          node tools/e2e-container-units.mjs
          node tools/e2e-full-pantry-cycle.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        id: quantity-model-cache
        with:
          path: assets/rekek/quantity-test
          key: rekek-quantity-v1-${{ runner.os }}-${{ hashFiles('tools/build-rekek-quantity-models.py', 'tools/build-rekek-quantity-vendor.mjs', 'tools/rekek-german-model-lock.json', 'tools/rekek-quantity-vendor-lock.json', 'tools/rekek_strict_offline.py', 'assets/rekek/quantity-test/**/*.traineddata') }}
      - name: Build optional REKEK quantity experiment
        run: |
          if [ "${{ steps.quantity-model-cache.outputs.cache-hit }}" != "true" ]; then
            pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
            pip install transformers==4.57.1 onnx==1.19.1 onnxruntime==1.23.2 sentencepiece==0.2.1 Pillow==11.3.0
            python3 tools/build-rekek-quantity-models.py
            node tools/build-rekek-quantity-vendor.mjs
          fi
          node tools/test-rekek-quantity.mjs
          node tools/e2e-rekek-quantity.mjs
          rm -rf build/rekek-model-source build/rekek-vendor
      - name: Remove isolated MHD build-only dependencies
        run: rm -rf experiments/date-mobile-build/node_modules build/rapidocr_onnxruntime-1.4.4-py3-none-any.whl
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          name: github-pages-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}


