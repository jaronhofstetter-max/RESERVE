name: Refresh SIMAP snapshot

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/update-data.yml"
      - "scripts/fetch_simap.py"
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: simap-data-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch current SIMAP projects
        run: python scripts/fetch_simap.py
      - name: Commit changed snapshot
        run: |
          if [ ! -f data/projects.json ]; then
            echo "Snapshot was not created"
            exit 1
          fi
          git add data/projects.json
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "tenderhawk-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Refresh SIMAP snapshot"
          git push
