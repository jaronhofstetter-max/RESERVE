name: Generate RESERVE recipe images

on:
  workflow_dispatch:
    inputs:
      max_images:
        description: Test batch size (maximum 10 review candidates)
        required: true
        default: '10'

permissions:
  contents: write

concurrency:
  group: reserve-recipe-images
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate controlled test batch
        env:
          REQUESTED_MAX: ${{ github.event.inputs.max_images || '10' }}
        run: |
          if ! [[ "$REQUESTED_MAX" =~ ^[0-9]+$ ]]; then
            echo 'max_images must be an integer.'
            exit 1
          fi
          if [ "$REQUESTED_MAX" -lt 1 ] || [ "$REQUESTED_MAX" -gt 10 ]; then
            echo 'Safety stop: generation is limited to 1-10 review candidates.'
            exit 1
          fi
      - name: Install deterministic renderer
        run: npm install --no-save sharp@0.33.5
      - name: Generate deterministic recipe composites
        env:
          MAX_IMAGES: ${{ github.event.inputs.max_images || '10' }}
        run: node tools/generate-recipe-composites.mjs
      - name: Commit review candidates
        run: |
          git add -A -- assets/recipe-review
          if git diff --cached --quiet -- assets/recipe-review; then
            echo 'No new review candidates staged.'
            exit 1
          fi
          echo 'Generated deterministic review candidates:'
          git diff --cached --name-status -- assets/recipe-review
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Generate deterministic recipe image candidates'
          git push origin HEAD:main
