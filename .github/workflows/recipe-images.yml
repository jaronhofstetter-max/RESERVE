name: Generate RESERVE recipe images

on:
  workflow_dispatch:
    inputs:
      max_images:
        description: Maximum number of missing recipe images to generate
        required: true
        default: '5'
  push:
    paths:
      - 'data/recipes.json'
      - 'data/quality-batch-*.json'

permissions:
  contents: write

concurrency:
  group: reserve-recipe-images
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Generate missing recipe images
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          REPLICATE_IMAGE_MODEL: black-forest-labs/flux-1.1-pro
          MAX_IMAGES: ${{ github.event.inputs.max_images || '5' }}
        run: node tools/generate-recipe-images.mjs
      - name: Commit generated images
        run: |
          if git diff --quiet -- assets/recipes; then
            echo 'No new images.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/recipes
          git commit -m 'Generate missing RESERVE recipe images'
          git push origin HEAD:main
