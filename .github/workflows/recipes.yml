name: Validate RESERVE recipes

on:
  push:
    paths:
      - 'data/recipes.json'
      - 'data/quality-batch-*.json'
      - 'tools/validate-recipes.mjs'
      - 'tools/build-test-fleet.mjs'
      - 'tools/merge-quality-batches.mjs'
      - 'tools/test-recommendations.mjs'
      - '.github/workflows/recipes.yml'
  pull_request:
    paths:
      - 'data/recipes.json'
      - 'data/quality-batch-*.json'
      - 'tools/validate-recipes.mjs'
      - 'tools/build-test-fleet.mjs'
      - 'tools/merge-quality-batches.mjs'
      - 'tools/test-recommendations.mjs'
      - '.github/workflows/recipes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate live recipe database
        run: node tools/validate-recipes.mjs data/recipes.json
      - name: Validate production quality batches
        run: |
          for f in data/quality-batch-*.json; do
            echo "Validating $f"
            node tools/validate-recipes.mjs "$f"
          done
      - name: Validate merged production library
        run: |
          node tools/merge-quality-batches.mjs data/recipes.json data/quality-batch-*.json build/recipes-production.json
          node tools/validate-recipes.mjs build/recipes-production.json
      - name: Test recommendation behavior
        run: node tools/test-recommendations.mjs build/recipes-production.json
      - name: Build 100-recipe test fleet
        run: node tools/build-test-fleet.mjs
      - name: Validate 100-recipe test fleet
        run: node tools/validate-recipes.mjs build/recipes-100.json
