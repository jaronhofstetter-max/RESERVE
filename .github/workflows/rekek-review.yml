name: REKEK browser review
on:
  pull_request:
    paths:
      - 'personal-recipe*.js'
      - 'rekek-digit-*.js'
      - 'rekek-quantity-*.js'
      - 'assets/rekek/**'
      - 'tests/fixtures/rekek-digit*'
      - 'tools/*rekek*'
      - '.github/workflows/rekek-review.yml'
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prepare production module integration
        run: node tools/prepare-rekek-browser-build.mjs
      - name: Check parser and review flow
        run: |
          node tools/test-personal-recipe-parser.mjs
          node tools/test-rekek.mjs
          node tools/test-rekek-sections.mjs
          node tools/test-rekek-digits.mjs
          node tools/e2e-rekek-digits.mjs
          node tools/e2e-recipe-portions.mjs
          node tools/e2e-rekek-review.mjs
          node tools/e2e-personal-recipes.mjs
          node tools/e2e-personal-recipe-flow.mjs
          node tools/e2e-personal-recipe-review.mjs
          node tools/e2e-recipe-preferences.mjs
          node tools/e2e-rekek-import.mjs
          node tools/e2e-personal-recipe-ocr.mjs
          node tools/e2e-rekek-columns.mjs
      - name: Save review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rekek-browser-review
          path: |
            build/rekek-browser-review
            build/recipe-quality-review
          if-no-files-found: ignore
