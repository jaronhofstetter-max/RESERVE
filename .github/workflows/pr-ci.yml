name: RESERVE Pull Request CI

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build validated live recipe library
        run: |
          node tools/enrich-recipes-v1.mjs data/recipes.json
          for f in data/quality-batch-*.json; do node tools/enrich-recipes-v1.mjs "$f"; done
          node tools/validate-recipes.mjs data/recipes.json
          for f in data/quality-batch-*.json; do node tools/validate-recipes.mjs "$f"; done
          node tools/merge-quality-batches.mjs data/recipes.json data/quality-batch-*.json build/recipes-live.json
          node tools/validate-recipes.mjs build/recipes-live.json
          REQUIRE_COMPLETE_RECIPE_QUALITY=1 node tools/audit-recipe-quality.mjs build/recipes-live.json
          cp build/recipes-live.json data/recipes.json
          node tools/apply-recipe-photos.mjs data/recipes.json
          node tools/build-recipe-index.mjs data/recipes.json data/recipe-index.json
          node tools/build-recipe-delivery.mjs data/recipes.json data/recipe-details data/recipe-catalog.json data/recipe-details-manifest.json
      - name: Validate recipe image factory
        env:
          REQUIRE_ALL_IMAGE_REFERENCES: "1"
        run: node tools/build-recipe-image-specs.mjs
      - name: Check JavaScript syntax
        run: |
          node --check date-token-guard-v1.js
          node --check date-policy-v1.js
          node --check shopping-v2.js
          node --check shopping-scan-v1.js
          node --check reserve-core-v3.js
          node --check cloud-sync-v1.js
          node --check barcode-v1.js
          node --check purchase-history-v1.js
          node --check receipt-capture-v1.js
          node --check price-learning-v1.js
          node --check price-trends-v1.js
          node --check weekly-price-bridge-v1.js
          node --check autopilot-v1.js
          node --check autopilot-v2.js
          node --check emergency-food-classifier-v1.js
          node --check emergency-v1.js
          node --check consumption-learning-v1.js
          node --check expiry-consumption-v1.js
          node --check expiry-ui-v1.js
          node --check expiry-learning-v1.js
          node --check mhd-review-v1.js
          node --check smart-priorities-v1.js
          node --check today-dashboard-v1.js
          node --check weekly-plan-v2.js
          node --check reserve-stock-protection-v1.js
          node --check pantry-intelligence-v1.js
          node --check recipe-index-runtime-v1.js
          node --check recipe-detail-runtime-v1.js
          node --check allergy-safety-v1.js
          node --check feedback-v1.js
          node --check usage-measurement-v1.js
          node --check tools/enrich-recipes-v1.mjs
          node --check tools/audit-recipe-quality.mjs
          node --check tools/build-recipe-image-specs.mjs
          node --check tools/generate-authentic-recipe-photos.mjs
          node --check tools/e2e-consumption.mjs
          node --check tools/e2e-expiry-ui.mjs
          node --check tools/e2e-autopilot-v2.mjs
          node --check tools/e2e-weekly-plan-v2.mjs
          node --check tools/e2e-smart-today.mjs
          node --check tools/e2e-receipt-capture.mjs
          node --check tools/e2e-price-learning.mjs
          node --check tools/e2e-price-trends.mjs
          node --check tools/e2e-mobile-journey.mjs
          node --check tools/e2e-feedback.mjs
          node --check tools/e2e-usage-measurement.mjs
          node --check tools/e2e-shopping-scan.mjs
          python3 -m py_compile tools/benchmark-synthetic-expiry-ocr.py
          bash -n tools/train-expiry-tesseract-v0.sh
      - name: Test expiry AI data pipelines
        run: |
          node tools/test-date-policy.mjs
          node tools/test-expiry-training-pipeline.mjs
          node tools/test-synthetic-expiry-dataset.mjs
      - name: Enable fast startup and compact recipe delivery
        run: |
          sed -i "s#fetch('data/recipes.json',{cache:'no-store'})#fetch('data/recipe-catalog.json',{cache:'default'})#" index.html
          sed -i "s#loadProfile();loadRecipes();#loadProfile();refresh();const loadRecipesLater=()=>loadRecipes();if('requestIdleCallback'in window)requestIdleCallback(loadRecipesLater,{timeout:1200});else setTimeout(loadRecipesLater,0);#" index.html
      - name: Enable RESERVE feature modules
        run: sed -i 's#</body>#<script>window.RESERVE_BUILD="20260920-expiry-lowcost-1";if("serviceWorker" in navigator){navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))).catch(()=>{});}if("caches" in window){caches.keys().then(ks=>Promise.all(ks.filter(k=>k.startsWith("tenderhawk-")).map(k=>caches.delete(k)))).catch(()=>{});}</script><script src="performance-v1.js?v=20261008-navigation-2"></script><script src="input-guard-v1.js?v=20260914-input-guard-2"></script><script src="shopping-v2.js"></script><script src="shopping-scan-v1.js"></script><script src="product-identity-v1.js?v=20261010-rice-source-1"></script><script src="ingredient-identity-v1.js?v=20261010-rice-source-1"></script><script src="date-token-guard-v1.js?v=20261019-date-token-1"></script><script src="date-policy-v1.js?v=20261019-neutral-date-1"></script><script src="reserve-core-v3.js?v=20261019-neutral-date-1"></script><script src="cloud-sync-v1.js?v=20261009-personal-1"></script><script src="multipack-v1.js"></script><script src="product-knowledge-v1.js?v=20261010-rice-source-1"></script><script src="barcode-v1.js?v=20261019-neutral-date-1"></script><script src="barcode-fast-feedback-v1.js?v=20260914-fast-feedback-1"></script><script src="barcode-mobile-focus-fix-v1.js?v=20260914-focus-1"></script><script src="barcode-camera-safe-v1.js?v=20260915-shared-camera-1"></script><script src="expiry-learning-v1.js?v=20261019-neutral-date-1"></script><script>window.RESERVE_EXPIRY_VISION_CONFIG={endpoint:"https://reserve-expiry-vision.jaronhofstetter.workers.dev"};</script><script src="expiry-vision-v1.js?v=20261010-mhd-spinner-1"></script><script src="expiry-camera-v1.js?v=20261019-date-token-1"></script><script src="scanner-priority-v1.js?v=20260914-scan-priority-3"></script><script src="purchase-history-v1.js"></script><script src="receipt-capture-v1.js"></script><script src="price-learning-v1.js"></script><script src="price-trends-v1.js"></script><script src="autopilot-v1.js?v=20261010-plan-cache-1"></script><script src="emergency-food-classifier-v1.js"></script><script src="emergency-v1.js"></script><script src="recipe-index-runtime-v1.js"></script><script src="recipe-detail-runtime-v1.js"></script><script src="consumption-learning-v1.js"></script><script src="expiry-consumption-v1.js?v=20261019-neutral-date-1"></script><script src="expiry-ui-v1.js?v=20261019-neutral-date-1"></script><script src="reserve-stock-protection-v1.js?v=20261008-identity-1"></script><script src="pantry-intelligence-v1.js?v=20261019-neutral-date-1"></script><script src="predictive-replenishment-v1.js?v=20261007-visual-flow-1"></script><script src="smart-priorities-v1.js?v=20261019-neutral-date-1"></script><script src="today-dashboard-v1.js?v=20261007-visual-flow-1"></script><script src="weekly-plan-v2.js?v=20261010-plan-cache-1"></script><script src="weekly-price-bridge-v1.js?v=20261010-plan-cache-1"></script><script src="autopilot-v2.js?v=20261018-startup-1"></script><script src="allergy-safety-v1.js?v=20261007-visual-flow-1"></script><script src="feedback-v1.js"></script><script src="usage-measurement-v1.js?v=20260914-idle-1"></script><script src="cabinet-inventory-v1.js?v=20261019-neutral-date-1"></script><script src="product-icons-v1.js?v=20260916-authoritative-icons-1"></script><script src="product-images-v1.js?v=20261010-ingredient-product-link-1"></script><script src="container-units-v1.js?v=20261010-purchase-count-1"></script><script src="barcode-learning-v1.js?v=20261008-knowledge-1"></script><script src="barcode-search-v2.js?v=20261019-neutral-date-1"></script><script src="mobile-ux-v1.js?v=20261019-neutral-date-1"></script><script src="visual-flow-v1.js?v=20261010-recipe-photo-layout-1"></script><script src="cabinet-grid-density-v1.js?v=20261009-clean-header-2"></script><script src="sidebar-navigation-v1.js?v=20261009-contrast-4"></script><script src="navigation-back-v1.js?v=20261010-ingredient-product-link-1"></script><script src="personal-recipe-parser-v1.js?v=20261011-rekek-review-1"></script><script src="personal-recipes-v1.js?v=20261011-rekek-review-1"></script><script>(function(){var on=false;try{var q=new URLSearchParams(location.search).get("reserveDiag");on=q==="1"||localStorage.getItem("reserveDiagV1")==="1"}catch(e){}if(on){var s=document.createElement("script");s.src="postscan-trace-v1.js?v=20260914-trace-1";document.body.appendChild(s)}})();</script></body>#' index.html
      - name: Smoke test production build
        run: node tools/smoke-test.mjs
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Build isolated MHD phone test
        run: |
          npm ci --prefix experiments/date-mobile-build --ignore-scripts --no-audit --no-fund
          python3 experiments/date-mobile-build/fetch-models.py
          node experiments/date-mobile-build/test.cjs
          node tools/test-date-mobile-diagnostics.mjs
          node tools/test-date-regions.mjs
          node tools/test-date-order.mjs
          node tools/test-date-tokens.mjs
          node experiments/date-mobile-build/build.cjs
      - name: Verify isolated MHD phone test
        run: node tools/e2e-date-mobile.mjs
      - name: Browser end-to-end test
        run: |
          node tools/e2e-startup-shell.mjs
          node tools/test-recipe-photos.mjs
          node tools/e2e-reserve.mjs
          node tools/e2e-consumption.mjs
          node tools/e2e-expiry-ui.mjs
          node tools/e2e-autopilot-v2.mjs
          node tools/e2e-weekly-plan-v2.mjs
          node tools/e2e-smart-today.mjs
          node tools/e2e-receipt-capture.mjs
          node tools/e2e-price-learning.mjs
          node tools/e2e-price-trends.mjs
          node tools/e2e-mobile-journey.mjs
          node tools/e2e-feedback.mjs
          node tools/e2e-usage-measurement.mjs
          node tools/e2e-shopping-scan.mjs
          node tools/e2e-mhd-review.mjs
          node tools/e2e-chuchitisch-recipes.mjs

