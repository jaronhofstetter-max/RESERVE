name: RESERVE Allergy Safety CI

on:
  pull_request:
    branches: ["main"]
    paths:
      - "allergy-safety-v1.js"
      - ".github/workflows/pages.yml"
      - ".github/workflows/allergy-safety-ci.yml"

permissions:
  contents: read

jobs:
  allergy-safety:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check allergy safety module syntax
        run: node --check allergy-safety-v1.js
      - name: Verify production integration
        run: |
          grep -q 'allergy-safety-v1.js' .github/workflows/pages.yml
          grep -Fq '<script src="allergy-safety-v1.js' .github/workflows/pages.yml
