<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RESERVE · HOEFLIGHT ONE</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="hoe-flight-theme.css">
<style>
:root{--g:#173f35;--cream:#f5f1e8;--card:#fffdf8;--line:#ded8ca;--ink:#1d2925;--muted:#6c746f;--orange:#e08a2e;--orangebg:#fff8ef}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:var(--cream);color:var(--ink)}header{background:#173f35;color:#fff;padding:22px 18px}.wrap{max-width:1100px;margin:auto}.brand{font-size:30px;font-weight:900;letter-spacing:2px}nav{display:flex;gap:7px;overflow:auto;margin-top:16px}.tab{white-space:nowrap;border:1px solid #ffffff44;background:#ffffff12;color:#fff;border-radius:999px;padding:9px 13px;font-weight:750}.tab.active{background:#fff;color:var(--g)}main{padding:18px}.panel{display:none}.panel.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.metric b{display:block;font-size:25px;color:var(--g)}h2,h3{color:var(--g)}.muted{color:var(--muted)}.small{font-size:12px}input,select{width:100%;padding:10px;border:1px solid #cfcabc;border-radius:9px;background:#fff;font:inherit;margin:4px 0}button{border:0;background:var(--g);color:#fff;padding:10px 13px;border-radius:9px;font-weight:800;cursor:pointer;margin-top:8px}.secondary{background:#e9e3d6;color:var(--g)}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#e6eee9;font-size:12px;margin:2px}.good{background:#dfeee5;color:#246448}.bad{background:#f7dfdc;color:#8b2d27}.warn{background:#fff0d9;color:#8c5200}.item,.meal,.result,.shop{padding:12px 0;border-bottom:1px solid var(--line)}.fallback{border:2px solid var(--orange);background:var(--orangebg);border-radius:14px;padding:14px;margin:10px 0}.ready{border:2px solid #4d8b69;background:#f4fbf6;border-radius:14px;padding:14px;margin:10px 0}.ingredient-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.ingredient{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;text-align:center}.step{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.stepno{min-width:34px;height:34px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:900}.filters{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:8px}.quality{border-left:5px solid var(--g)}.portion{margin:10px 0;padding:10px 12px;border-radius:12px;background:#1677ff18;border:1px solid #1677ff55}.perperson{font-size:12px;color:var(--muted);margin-top:4px}@media(max-width:750px){.grid{grid-template-columns:1fr 1fr}.grid2,.filters{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap"><div class="brand">HOEFLIGHT</div><div>RESERVE</div><nav><button class="tab active" onclick="show('home',this)">Home</button><button class="tab" onclick="show('stock',this)">Vorrat</button><button class="tab" onclick="show('menu',this)">Plan</button><button class="tab" onclick="show('search',this)">Suchen</button><button class="tab" onclick="show('cook',this)">Kochen</button><button class="tab" onclick="show('shopping',this)">Einkauf</button><button class="tab" onclick="show('profile',this)">Profil</button></nav></div></header>
<main class="wrap">
<section id="home" class="panel active"><div class="card"><div id="timeLabel" class="small muted"></div><h2 id="mealTitle">Was soll ich jetzt essen?</h2><div id="smartNow"></div></div><div class="grid"><div class="card metric"><span>Vorrat</span><b id="stockCount">0</b></div><div class="card metric"><span>Sofort kochbar</span><b id="dishCount">0</b></div><div class="card metric"><span>Rezepte</span><b id="recipeCount">0</b></div><div class="card metric"><span>Datenqualität</span><b id="qualityScore">–</b></div></div><div class="card quality"><h3>Systemstatus</h3><div id="qualityInfo"></div></div></section>
<section id="stock" class="panel"><div class="card"><h2>Mein Vorrat</h2><div class="grid2"><input id="food" placeholder="Lebensmittel"><input id="qty" placeholder="z.B. 500 g, 1 l, 4 Stück"></div><div class="grid2"><input id="expiry" type="date"><select id="cat"><option>Getreide & Beilagen</option><option>Gemüse & Früchte</option><option>Protein</option><option>Milchprodukte</option><option>Sonstiges</option></select></div><button onclick="addStock()">Hinzufügen</button></div><div class="card" id="stockList"></div></section>
<section id="menu" class="panel"><div class="card"><h2>7-Tage-Menüplan</h2><p class="muted">Nur vollständig kochbare, geprüfte Rezepte.</p><div id="mealPlan"></div></div></section>
<section id="search" class="panel"><div class="card"><h2>Menüs suchen</h2><div class="filters"><input id="recipeSearch" placeholder="Gericht oder Zutat" oninput="renderSearch()"><select id="fDiet" onchange="renderSearch()"><option value="">Alle Ernährungsformen</option><option>Vegan</option><option>Vegetarisch</option><option>Alles</option></select><select id="fDifficulty" onchange="renderSearch()"><option value="">Alle Schwierigkeiten</option><option>Sehr einfach</option><option>Einfach</option><option>Mittel</option><option>Anspruchsvoll</option></select><select id="fCuisine" onchange="renderSearch()"><option value="">Alle Küchen</option></select></div><div id="searchResults"></div></div></section>
<section id="cook" class="panel"><div class="card"><h2>Geführter Kochmodus</h2><select id="cookRecipe" onchange="renderCook()"></select><div id="cookView"></div></div></section>
<section id="shopping" class="panel"><div class="card"><h2>Einkaufsliste</h2><div class="grid2"><input id="shopInput" placeholder="Lebensmittel"><button onclick="addShop()">Hinzufügen</button></div><div id="shopList"></div></div></section>
<section id="profile" class="panel"><div class="card"><h2>Profil</h2><div class="grid2"><input id="people" type="number" min="1" value="1"><select id="diet"><option>Alles</option><option>Vegetarisch</option><option>Vegan</option></select></div><input id="avoid" placeholder="Allergien / vermeiden, z.B. Milch, Ei"><button onclick="saveProfile()">Speichern</button><p id="saved"></p></div></section>
</main>
<script>
const defaults=[{n:'Reis',q:'1.5 kg',e:'',c:'Getreide & Beilagen'},{n:'Eier',q:'8 Stück',e:'',c:'Protein'},{n:'Brokkoli',q:'600 g',e:'',c:'Gemüse & Früchte'},{n:'Poulet',q:'500 g',e:'',c:'Protein'}];
let recipes=[],rejected=[],stock=JSON.parse(localStorage.getItem('reserveStock')||'null')||defaults,shopping=JSON.parse(localStorage.getItem('reserveShopping')||'[]');
const N=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
const ingredientIcons={'poulet':'🍗','hahnchen':'🍗','reis':'🍚','brokkoli':'🥦','olivenol':'🫒','eier':'🥚','ei':'🥚','karotten':'🥕','karotte':'🥕','tomaten':'🍅','tomate':'🍅','naturjoghurt':'🥣','joghurt':'🥣','haferflocken':'🌾','banane':'🍌','beeren':'🫐','linsen':'🫘','kartoffeln':'🥔','kartoffel':'🥔','quark':'🥣','gurke':'🥒','krauter':'🌿','vollkornpasta':'🍝','pasta':'🍝','zwiebel':'🧅','zwiebeln':'🧅','haferdrink':'🥛','milch':'🥛','vollkornbrot':'🍞','brot':'🍞','spinat':'🥬','kichererbsen':'🫘','paprika':'🫑','apfel':'🍎','kase':'🧀'};
function profile(){return JSON.parse(localStorage.getItem('reserveProfile')||'{"people":1,"diet":"Alles","avoid":""}')}
function persons(){return Math.max(1,+profile().people||1)}
function ingredientIcon(name){let key=N(name);return ingredientIcons[key]||'🥣'}
function recipeVisual(r){return `<div class="recipe-visual" aria-hidden="true"><span>${r.dish||'🍽️'}</span><div class="visual-placeholder">Gerichtbild</div></div>`}
function validateRecipe(r,ids){let e=[];if(!r||typeof r!=='object')return['kein Objekt'];['id','name','type','diet','dish','cuisine','difficulty','status'].forEach(k=>{if(!r[k])e.push(k+' fehlt')});if(ids.has(r.id))e.push('ID doppelt');else ids.add(r.id);if(!['Frühstück','Hauptmahlzeit'].includes(r.type))e.push('type ungültig');if(!['Alles','Vegetarisch','Vegan'].includes(r.diet))e.push('diet ungültig');if(!Array.isArray(r.mealTimes)||!r.mealTimes.length)e.push('mealTimes fehlen');if(!Array.isArray(r.ingredients)||r.ingredients.length<2)e.push('zu wenig Zutaten');else r.ingredients.forEach(i=>{if(!i.name||!(i.amount>0)||!['g','ml','Stück'].includes(i.unit))e.push('Zutat ungültig')});if(!Array.isArray(r.steps)||r.steps.length<2)e.push('zu wenig Schritte');let n=r.nutrition||{};['kcal','protein','carbs','fat','fiber'].forEach(k=>{if(!(Number.isFinite(n[k])&&n[k]>=0))e.push('nutrition.'+k)});return e}
async function loadRecipes(){try{let raw=await fetch('data/recipes.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()});let ids=new Set();rejected=[];recipes=raw.filter(r=>{let e=validateRecipe(r,ids);if(e.length||r.status!=='approved'){rejected.push({id:r.id||'?',errors:e});return false}return true});populateFilters();refresh()}catch(e){qualityInfo.innerHTML='<span class="pill bad">Rezeptdatenbank konnte nicht geladen werden.</span>'}}
function allowed(r){let p=profile(),avoid=(p.avoid||'').split(',').map(N).filter(Boolean);if(p.diet==='Vegan'&&r.diet!=='Vegan')return false;if(p.diet==='Vegetarisch'&&r.diet==='Alles')return false;if(avoid.some(a=>(r.allergens||[]).map(N).includes(a)||r.ingredients.some(i=>N(i.name).includes(a))))return false;return true}
function parseAmount(s){let m=(s||'').toLowerCase().replace(',','.').match(/([0-9.]+)\s*(kg|g|l|ml|stück|stuck|stk)?/);if(!m)return null;let v=+m[1],u=m[2]||'stück';if(u==='kg'){v*=1000;u='g'}if(u==='l'){v*=1000;u='ml'}if(u==='stuck'||u==='stk')u='stück';return{v,u}}
function fmt(v,u){v=Math.round(v*10)/10;if(u==='g'&&v>=1000)return(v/1000)+' kg';if(u==='ml'&&v>=1000)return(v/1000)+' l';return v+' '+u}
function totalAmount(i){return fmt(i.amount*persons(),i.unit)}
function portionLabel(){let p=persons();return p+' '+(p===1?'Person':'Personen')}
function stockEntry(name){return stock.find(s=>N(s.n).includes(N(name))||N(name).includes(N(s.n)))}
function need(r,i){let req={v:i.amount*persons(),u:i.unit.toLowerCase()==='stück'?'stück':i.unit},s=stockEntry(i.name),have=s?parseAmount(s.q):null;if(!s||!have||have.u!==req.u)return{ok:false,missing:fmt(req.v,req.u)};let d=Math.max(0,req.v-have.v);return{ok:d===0,missing:fmt(d,req.u)}}
function deficits(r){return r.ingredients.map(i=>({name:i.name,...need(r,i)})).filter(x=>!x.ok)}
function cookable(r){return allowed(r)&&!deficits(r).length}
function missingScore(r){let d=deficits(r);return d.length*100000+d.reduce((a,x)=>a+(parseAmount(x.missing)?.v||1),0)}
function missingText(d){if(!d.length)return'Alles vorhanden.';let list=d.map(x=>x.name+' – '+x.missing);let joined=list.length===1?list[0]:list.slice(0,-1).join(', ')+' und '+list[list.length-1];return(d.length===1?'Es fehlt ':'Es fehlen ')+joined+'.'}
function currentMeal(){let h=new Date().getHours();if(h>=5&&h<10)return'Frühstück';if(h>=10&&h<14)return'Mittagessen';if(h>=14&&h<17)return'Zwischenmahlzeit';if(h>=17&&h<22)return'Abendessen';return'Abendessen'}
function show(id,b){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');if(id==='search')renderSearch();if(id==='cook')renderCook()}
function populateFilters(){let cs=[...new Set(recipes.map(r=>r.cuisine))].sort();fCuisine.innerHTML='<option value="">Alle Küchen</option>'+cs.map(x=>`<option>${x}</option>`).join('')}
function renderStock(){stockList.innerHTML='<h3>Lebensmittel</h3>'+stock.map((x,i)=>`<div class="item"><b>${x.n}</b> · ${x.q}${x.e?` <span class="pill warn">bis ${x.e}</span>`:''}<br><button class="secondary" onclick="removeStock(${i})">Entfernen</button></div>`).join('');localStorage.setItem('reserveStock',JSON.stringify(stock))}
function addStock(){if(!food.value.trim())return;stock.push({n:food.value.trim(),q:qty.value.trim()||'1 Stück',e:expiry.value,c:cat.value});food.value=qty.value=expiry.value='';refresh()}
function removeStock(i){stock.splice(i,1);refresh()}
function recipeCard(r,state='ready'){let d=deficits(r);return `<article class="recipe-card ${state}">${recipeVisual(r)}<div class="recipe-card-body"><h3>${r.name}</h3><div class="recipe-meta"><span>${r.cuisine}</span><span>${r.difficulty}</span><span>${r.prepMinutes+r.cookMinutes} Min.</span></div>${d.length?`<div class="recipe-status missing">${missingText(d)}</div>`:`<div class="recipe-status available">✓ Alles vorhanden</div>`}<button onclick="startCooking('${r.id}')">${d.length?'Rezept ansehen':'Jetzt kochen'}</button></div></article>`}
function renderSmart(){let mt=currentMeal(),list=recipes.filter(allowed).filter(r=>r.mealTimes.includes(mt)),ready=list.filter(cookable);timeLabel.textContent='Jetzt '+new Date().toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'})+' · '+mt+' · Mengen für '+portionLabel();mealTitle.textContent='Was soll ich jetzt essen?';if(ready.length){smartNow.innerHTML='<div class="recipe-card-grid">'+ready.slice(0,3).map(r=>recipeCard(r,'ready')).join('')+'</div>';return}let alt=list.map(r=>({r,d:deficits(r),s:missingScore(r)})).sort((a,b)=>a.s-b.s).slice(0,5);smartNow.innerHTML='<p class="muted">Am wenigsten fehlt bei – berechnet für '+portionLabel()+':</p><div class="recipe-card-grid">'+alt.map(x=>recipeCard(x.r,'fallback')).join('')+'</div>'}
function renderSearch(){let q=N(recipeSearch.value),list=recipes.filter(allowed).filter(r=>(!q||N([r.name,r.cuisine,r.diet,(r.tags||[]).join(' '),r.ingredients.map(i=>i.name).join(' ')].join(' ')).includes(q))&&(!fDiet.value||r.diet===fDiet.value)&&(!fDifficulty.value||r.difficulty===fDifficulty.value)&&(!fCuisine.value||r.cuisine===fCuisine.value));searchResults.innerHTML=list.length?'<div class="recipe-card-grid">'+list.map(r=>recipeCard(r,'result')).join('')+'</div>':'<p class="muted">Keine Treffer.</p>'}
function openSuggestion(id){let r=recipes.find(x=>x.id===id);recipeSearch.value=r?.name||'';show('search',document.querySelectorAll('.tab')[3])}
function addRecipeMissing(id,btn){let r=recipes.find(x=>x.id===id);deficits(r).forEach(d=>{let t=d.name+' – '+d.missing;if(!shopping.includes(t))shopping.push(t)});renderShop();if(btn){btn.textContent='✓ Hinzugefügt';btn.disabled=true;btn.classList.add('added')}}
function renderShop(){shopList.innerHTML=shopping.length?shopping.map((x,i)=>`<div class="shop"><input type="checkbox" onchange="shopping.splice(${i},1);renderShop()"> ${x}</div>`).join(''):'<p class="muted">Leer.</p>';localStorage.setItem('reserveShopping',JSON.stringify(shopping))}
function addShop(){if(shopInput.value.trim()){shopping.push(shopInput.value.trim());shopInput.value='';renderShop()}}
function fillCook(){let old=cookRecipe.value;cookRecipe.innerHTML=recipes.filter(allowed).map(r=>`<option value="${r.id}">${r.name}</option>`).join('');if(old&&recipes.some(r=>r.id===old))cookRecipe.value=old}
function startCooking(id){fillCook();cookRecipe.value=id;show('cook',document.querySelectorAll('.tab')[4]);renderCook()}
function ingredientCard(r,i){let z=need(r,i);return `<div class="ingredient ${z.ok?'in-stock':'is-missing'}"><div class="ingredient-visual">${ingredientIcon(i.name)}<span class="ingredient-image-slot">Bild</span></div><div class="ingredient-name">${i.name}</div><div class="ingredient-total">${totalAmount(i)} <span>gesamt</span></div><div class="perperson">${fmt(i.amount,i.unit)} / Person</div><div class="ingredient-state">${z.ok?'✓ vorhanden':'Fehlt: '+z.missing}</div></div>`}
function renderCook(){let r=recipes.find(x=>x.id===cookRecipe.value)||recipes.filter(allowed)[0];if(!r)return;let d=deficits(r);cookView.innerHTML=`${recipeVisual(r)}<div class="cook-title"><h2>${r.name}</h2><div class="recipe-meta"><span>${r.cuisine}</span><span>${r.difficulty}</span><span>${r.prepMinutes+r.cookMinutes} Min.</span></div></div><div class="portion"><b>${portionLabel()}</b><div class="perperson">Gesamtmengen für deinen Haushalt; darunter die Menge pro Person.</div></div>${d.length?`<div class="missing-card"><div><strong>${missingText(d)}</strong><div class="small">Fehlende Mengen können direkt übernommen werden.</div></div><button onclick="addRecipeMissing('${r.id}',this)">+ Zur Einkaufsliste</button></div>`:`<div class="available-card">✓ Alles vorhanden.</div>`}<div class="ingredient-grid">${r.ingredients.map(i=>ingredientCard(r,i)).join('')}</div><h3>Schritte</h3>${r.steps.map((s,i)=>`<div class="step"><div class="stepno">${i+1}</div><div>${s}</div></div>`).join('')}${!d.length?`<button class="finish-cook" onclick="finishCooking('${r.id}')">✓ Fertig – Vorrat aktualisieren</button>`:''}`}
function finishCooking(id){let r=recipes.find(x=>x.id===id),p=persons();if(!r||!cookable(r))return;r.ingredients.forEach(i=>{let idx=stock.findIndex(s=>N(s.n).includes(N(i.name))||N(i.name).includes(N(s.n)));if(idx<0)return;let h=parseAmount(stock[idx].q),u=i.unit.toLowerCase()==='stück'?'stück':i.unit;if(!h||h.u!==u)return;let left=h.v-i.amount*p;if(left<=0)stock.splice(idx,1);else stock[idx].q=fmt(left,u)});refresh();show('home',document.querySelectorAll('.tab')[0])}
function renderPlan(){let pool=recipes.filter(cookable),days=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];mealPlan.innerHTML='<div class="portion"><b>Menüplan für '+portionLabel()+'</b><div class="perperson">Zutatenmengen werden beim Öffnen eines Rezepts automatisch angezeigt.</div></div>'+days.map((d,i)=>{let b=pool.filter(r=>r.mealTimes.includes('Frühstück')),m=pool.filter(r=>r.mealTimes.includes('Mittagessen')),e=pool.filter(r=>r.mealTimes.includes('Abendessen'));return `<div class="meal"><b>${d}</b><br>Frühstück: ${b.length?b[i%b.length].name:'–'}<br>Mittag: ${m.length?m[i%m.length].name:'–'}<br>Abend: ${e.length?e[i%e.length].name:'–'}</div>`}).join('')}
function updateQuality(){recipeCount.textContent=recipes.length;let total=recipes.length+rejected.length,score=total?Math.round(recipes.length/total*100):0;qualityScore.textContent=score+'%';qualityInfo.innerHTML=`<span class="pill good">${recipes.length} freigegeben</span> <span class="pill ${rejected.length?'bad':'good'}">${rejected.length} blockiert</span>`}
function updateHome(){stockCount.textContent=stock.length;dishCount.textContent=recipes.filter(cookable).length;updateQuality();renderSmart()}
function saveProfile(){localStorage.setItem('reserveProfile',JSON.stringify({people:+people.value||1,diet:diet.value,avoid:avoid.value.trim()}));saved.textContent='Gespeichert. Mengen wurden neu berechnet.';refresh()}
function loadProfile(){let p=profile();people.value=p.people||1;diet.value=p.diet||'Alles';avoid.value=p.avoid||''}
function refresh(){renderStock();renderShop();fillCook();renderSearch();renderPlan();updateHome()}
loadProfile();loadRecipes();setInterval(renderSmart,60000);
</script>
</body>
</html>
